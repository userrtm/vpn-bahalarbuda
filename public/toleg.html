<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UserrTM Payment</title>

  <!-- TELEGRAM VE WHATSAPP İÇİN BÜYÜK ÖNİZLEME RESMİ ETİKETLERİ -->
  <meta name="description" content="Töleg görnüşini saýlaň we aňsat töleg ediň." />
  <link rel="canonical" href="https://www.userrtm.org/toleg.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="UserrTM Payment" />
  <meta property="og:description" content="Töleg görnüşini saýlaň we aňsat töleg ediň." />
  <meta property="og:url" content="https://www.userrtm.org/toleg.html" />
  <meta property="og:site_name" content="UserrTM Servers" />
  
  <!-- GITHUB ÜZERİNDEKİ KESİN RAW RESİM BAĞLANTISI -->
  <meta property="og:image" content="https://raw.githubusercontent.com/userrtm/vpn-bahalarbuda/main/public/payment-preview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="UserrTM Payment" />
  <meta name="twitter:description" content="Töleg görnüşini saýlaň we aňsat töleg ediň." />
  <meta name="twitter:image" content="https://raw.githubusercontent.com/userrtm/vpn-bahalarbuda/main/public/payment-preview.jpg" />

  <style>
    :root {
      /* VIP Siber Arka Plan Renkleri */
      --bg-main: #050811;
      --card-bg: rgba(11, 19, 36, 0.7);
      --card-border: rgba(56, 189, 248, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: linear-gradient(90deg, #38bdf8, #60a5fa);
      --success: linear-gradient(135deg, #00f2fe, #4facfe);
      --text-glow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    body.light {
      --bg-main: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(15, 23, 42, 0.08);
      --text: #0f172a;
      --muted: #64748b;
      --primary: linear-gradient(90deg, #0284c7, #3b82f6);
      --success: linear-gradient(90deg, #10b981, #059669);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text); 
      min-height: 100vh; 
      padding: 24px 16px; 
      transition: 0.3s; 
      position: relative; 
      overflow-x: hidden;
    }
    
    /* VIP Siber Cyber-Grid Çizgileri */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 0;
      pointer-events: none;
    }
    
    /* VIP Akıcı Hareket Eden Neon Işık Animasyonu (Arka Plan) */
    @keyframes vipGlowAnimation {
      0% { transform: scale(1) translate(0px, 0px) rotate(0deg); opacity: 0.8; }
      33% { transform: scale(1.15) translate(30px, -40px) rotate(120deg); opacity: 1; }
      66% { transform: scale(0.9) translate(-20px, 30px) rotate(240deg); opacity: 0.7; }
      100% { transform: scale(1) translate(0px, 0px) rotate(360deg); opacity: 0.8; }
    }

    body::after {
      content: "";
      position: fixed;
      top: -20%; left: -20%; right: -20%; bottom: -20%;
      background: 
        radial-gradient(circle at 20% 25%, rgba(147, 51, 234, 0.22), transparent 45%),
        radial-gradient(circle at 80% 20%, rgba(56, 189, 248, 0.28), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(249, 115, 22, 0.14), transparent 45%);
      z-index: 0;
      pointer-events: none;
      animation: vipGlowAnimation 22s infinite linear;
    }
    
    body.light::after {
      animation: none;
      background: 
        radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.06), transparent 40%);
    }

    /* Giriş Animasyonu */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container { max-width: 460px; margin: 0 auto; position: relative; z-index: 2; animation: fadeInUp 0.6s ease-out both; }
    
    .topbar { display: flex; justify-content: space-between; margin-bottom: 32px; align-items: center; }
    .lang-select { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px 16px; border-radius: 14px; font-weight: 600; cursor: pointer; backdrop-filter: blur(12px); outline: none; }
    .theme-btn { background: var(--card-bg); border: 1px solid var(--card-border); font-size: 18px; cursor: pointer; padding: 8px 12px; border-radius: 14px; backdrop-filter: blur(12px); transition: 0.2s; }

    .hero { text-align: center; margin-bottom: 32px; }
    .hero h1 { font-size: 38px; margin-bottom: 10px; font-weight: 900; background: linear-gradient(135deg, #fff 30%, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(var(--text-glow)); letter-spacing: -0.5px; }
    body.light .hero h1 { background: none; -webkit-text-fill-color: var(--text); filter: none; }
    .hero p { color: var(--muted); font-size: 15px; }

    .segmented-control { display: flex; background: rgba(0, 0, 0, 0.45); padding: 5px; border-radius: 18px; margin-bottom: 24px; border: 1px solid var(--card-border); backdrop-filter: blur(12px); }
    .segment-btn { flex: 1; border: none; background: none; color: var(--muted); padding: 15px; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 14px; transition: 0.25s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .segment-btn.active { background: linear-gradient(135deg, #1e293b, #0f172a); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    body.light .segment-btn.active { background: #fff; color: #0284c7; border: 1px solid rgba(0,0,0,0.05); box-shadow: none; }
    .segment-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .main-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 32px; padding: 36px 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); backdrop-filter: blur(24px); position: relative; }
    
    /* Kart Çevresindeki İnce VIP Işık Çizgisi */
    .main-card::before {
      content: ""; position: absolute; top:0; left:0; right:0; bottom:0; border-radius: 32px;
      padding: 1px; background: linear-gradient(135deg, rgba(56,189,248,0.35), transparent, rgba(147,51,234,0.25));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }

    .number-display { font-size: 42px; font-weight: 900; text-align: center; margin: 12px 0 28px 0; background: linear-gradient(135deg, #ffffff, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1.5px; filter: drop-shadow(0 2px 8px rgba(56,189,248,0.2)); }
    body.light .number-display { background: none; -webkit-text-fill-color: var(--text); filter: none; }

    .custom-select { width: 100%; padding: 18px; border-radius: 16px; background: rgba(5, 10, 20, 0.65); border: 1px solid var(--card-border); color: var(--text); font-size: 16px; font-weight: 700; margin-bottom: 24px; outline: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-repeat: no-repeat; background-position: right 16px center; }
    body.light .custom-select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-color: #fff; }

    /* Premium Buton Tasarımları */
    .btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 14px; position: relative; }
    .btn svg { width: 20px; height: 20px; fill: currentColor; }
    
    .btn-primary { background: var(--primary); color: #050811; }
    .btn-success { background: var(--success); color: #050811; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25); }
    body.light .btn-success { color: #fff; box-shadow: none; }
    
    .btn:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: 0 8px 24px rgba(56,189,248,0.3); }
    .btn:active { transform: translateY(0); }

    /* Başarı Kopyalama Efekti */
    @keyframes successPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); filter: brightness(1.3); }
      100% { transform: scale(1); }
    }
    .btn-success.copied-animation { animation: successPulse 0.4s ease-out; }

    .info-note { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.6; margin-top: 10px; padding: 0 8px; }
    .hidden { display: none; }
    
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #00f2fe, #4facfe); color: #050811; padding: 14px 32px; border-radius: 50px; font-weight: 800; opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="container">
    <div class="topbar">
      <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
        <option value="tk">🇹🇲 Türkmençe</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="tr">🇹🇷 Türkçe</option>
      </select>
      <button class="theme-btn" onclick="toggleTheme()">☀️</button>
    </div>

    <div class="hero">
      <h1 id="title">UserrTM Payment</h1>
      <p id="subtitle">Töleg görnüşini saýlaň we aňsat töleg ediň.</p>
    </div>

    <div class="segmented-control">
      <button class="segment-btn active" id="tabTerminal" onclick="switchTab('terminal')">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
        <span id="tabTerminalTxt">Terminal</span>
      </button>
      <button class="segment-btn" id="tabPhone" onclick="switchTab('phone')">
        <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
        <span id="tabPhoneTxt">Telefondan (0804)</span>
      </button>
    </div>

    <div class="main-card">
      
      <!-- TERMINAL BÖLÜMÜ -->
      <div id="terminalSection">
        <div class="number-display">62434203</div>
        <button class="btn btn-success" id="btnTermCopy" onclick="copyText('62434203', 'btnTermCopy')">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span id="lblCopy">Kopya et</span>
        </button>
        <p class="info-note" id="noteTerminal">Şu nomere töleg geçiriň.</p>
      </div>

      <!-- TELEFON (0804) BÖLÜMÜ -->
      <div id="phoneSection" class="hidden">
        <select class="custom-select" id="phoneDropdown"></select>
        <button class="btn btn-success" id="btnPhoneCopy" onclick="copySelectedPhone()">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span id="lblCopy2">Kopya et</span>
        </button>
        <button class="btn btn-primary" onclick="paySelectedPhone()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          <span id="lblPay">Töle (SMS)</span>
        </button>
        <p class="info-note" id="notePhone">Töle basanyňyzda SMS açylar, yzyna mukdaryny ýazyp iberiň.</p>
      </div>

    </div>
  </div>

  <div class="toast" id="toast">Kopyalandy!</div>

  <script>
    // İstenen iki numara güncellenmiş listeden tamamen kaldırıldı
    const phoneNumbers = [
      "+99362434203", "+99364883003", "+99364517607", "+99361703386", 
      "+99361027826", "+99362016486", "+99371298323", "+99371868833", 
      "+99371086659", "+99364125409", 
      "+99361856842", "+99365590742", "+99362723560", "+99361481041", "+99361910924"
    ];

    const texts = {
      tk: {
        subtitle: "Töleg görnüşini saýlaň we aňsat töleg ediň.",
        tabTerminal: "Terminal", tabPhone: "Telefondan (0804)",
        lblCopy: "Kopya et", lblCopied: "Kopyalandy!", lblPay: "Töle (SMS)",
        noteTerminal: "Şu nomere töleg geçiriň.",
        notePhone: "Töle basanyňyzda SMS açylar, yzyna mukdaryny ýazyp iberiň.",
        copied: "Kopyalandy!"
      },
      ru: {
        subtitle: "Выберите способ оплаты и произведите платеж.",
        tabTerminal: "Терминал", tabPhone: "С телефона (0804)",
        lblCopy: "Копировать", lblCopied: "Скопировано!", lblPay: "Оплатить (SMS)",
        noteTerminal: "Переведите средства на этот nomor.",
        notePhone: "Кнопка откроет SMS. Допишите сумму и отправьте.",
        copied: "Скопировано!"
      },
      tr: {
        subtitle: "Ödeme türünü seçin ve kolayca ödeme yapın.",
        tabTerminal: "Terminal", tabPhone: "Telefondan (0804)",
        lblCopy: "Kopyala", lblCopied: "Kopyalandı!", lblPay: "Öde (SMS)",
        noteTerminal: "Bu numaraya ödeme yapın.",
        notePhone: "Öde'ye basınca SMS açılır, tutarı yazıp gönderin.",
        copied: "Kopyalandı!"
      }
    };

    let currentLang = localStorage.getItem("lang") || "tk";

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);
      const t = texts[lang];
      
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("tabTerminalTxt").textContent = t.tabTerminal;
      document.getElementById("tabPhoneTxt").textContent = t.tabPhone;
      
      document.getElementById("lblCopy").textContent = t.lblCopy;
      document.getElementById("lblCopy2").textContent = t.lblCopy;
      document.getElementById("lblPay").textContent = t.lblPay;
      
      document.getElementById("noteTerminal").textContent = t.noteTerminal;
      document.getElementById("notePhone").textContent = t.notePhone;
      document.getElementById("langSelect").value = lang;
      buildDropdown();
    }

    function switchTab(type) {
      document.getElementById("tabTerminal").classList.toggle("active", type === 'terminal');
      document.getElementById("tabPhone").classList.toggle("active", type === 'phone');
      document.getElementById("terminalSection").classList.toggle("hidden", type !== 'terminal');
      document.getElementById("phoneSection").classList.toggle("hidden", type !== 'phone');
    }

    function buildDropdown() {
      const select = document.getElementById("phoneDropdown");
      select.innerHTML = "";
      phoneNumbers.forEach((num, index) => {
        const opt = document.createElement("option");
        opt.value = num;
        opt.textContent = `Nomer ${index + 1} (${num})`;
        select.appendChild(opt);
      });
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle("light");
      localStorage.setItem("theme", isLight ? "light" : "dark");
    }

    function showToast(txt) {
      const toast = document.getElementById("toast");
      toast.textContent = txt;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    async function copyText(text, btnId) {
      await navigator.clipboard.writeText(text);
      showToast(texts[currentLang].copied);
      
      const btn = document.getElementById(btnId);
      const span = btn.querySelector('span');
      const originalText = span.textContent;
      
      btn.classList.add('copied-animation');
      span.textContent = texts[currentLang].lblCopied;
      
      setTimeout(() => { 
        span.textContent = originalText; 
        btn.classList.remove('copied-animation');
      }, 1500);
    }

    function copySelectedPhone() {
      const val = document.getElementById("phoneDropdown").value;
      copyText(val, 'btnPhoneCopy');
    }

    function paySelectedPhone() {
      const val = document.getElementById("phoneDropdown").value;
      window.location.href = `sms:0804?body=${encodeURIComponent(val + " ")}`;
    }

    window.addEventListener("DOMContentLoaded", () => {
      if(localStorage.getItem("theme") === "light") document.body.classList.add("light");
      setLang(currentLang);
    });
  </script>
</body>
</html>
