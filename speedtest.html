<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UserrTM Speed Test</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef1f5;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    .start {
      margin: 40px auto;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #5b62f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #5b62f4;
      cursor: pointer;
    }

    .card {
      background: white;
      margin: 15px;
      padding: 20px;
      border-radius: 15px;
      font-size: 24px;
    }

    .progress {
      height: 10px;
      background: #ddd;
      margin: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #5b62f4;
    }
  </style>
</head>

<body>

<h1>UserrTM Speed Test</h1>

<div class="start" onclick="start()">Start</div>

<div id="status">Taýar</div>

<div class="progress">
  <div id="bar" class="bar"></div>
</div>

<div class="card">Download: <span id="d">0</span> Mbps</div>
<div class="card">Upload: <span id="u">0</span> Mbps</div>
<div class="card">Ping: <span id="p">0</span> ms</div>
<div class="card">Jitter: <span id="j">0</span> ms</div>

<script>
const API = "https://api.userrtmspeedtest.vip";

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function setBar(v){
  document.getElementById("bar").style.width = v + "%";
}

function avg(a){ return a.reduce((x,y)=>x+y)/a.length; }

function jitter(a){
  let d=[];
  for(let i=1;i<a.length;i++){
    d.push(Math.abs(a[i]-a[i-1]));
  }
  return avg(d||[0]);
}

async function ping(){
  let arr=[];
  for(let i=0;i<6;i++){
    let s=performance.now();
    await fetch(API+"/ping?"+Date.now());
    let e=performance.now();
    arr.push(e-s);

    document.getElementById("p").innerText = avg(arr).toFixed(2);
    document.getElementById("j").innerText = jitter(arr).toFixed(2);

    setBar(10+i*5);
    await sleep(100);
  }
}

async function download(){
  let r = await fetch(API+"/download");
  let reader = r.body.getReader();

  let rec=0;
  let start=performance.now();

  while(true){
    let {done,value} = await reader.read();
    if(done) break;

    rec += value.length;

    let sec=(performance.now()-start)/1000;
    let mbps=(rec*8/sec/1000000);

    document.getElementById("d").innerText = mbps.toFixed(2);
    setBar(40);

    if(sec>6){
      reader.cancel();
      break;
    }
  }
}

async function upload(){
  let total=0;
  let start=performance.now();

  while(true){
    let arr = new Uint8Array(256*1024);
    crypto.getRandomValues(arr);

    let res = await fetch(API+"/upload", {
      method:"POST",
      body:arr
    });

    await res.json();

    total += arr.length;

    let sec=(performance.now()-start)/1000;
    let mbps=(total*8/sec/1000000);

    document.getElementById("u").innerText = mbps.toFixed(2);
    setBar(80);

    if(sec>6) break;
  }
}

async function start(){
  document.getElementById("status").innerText = "Başlanýar...";

  try{
    await ping();
    await download();
    await upload();

    document.getElementById("status").innerText = "Tamam ✔";
    setBar(100);
  }catch(e){
    document.getElementById("status").innerText = "Ýalňyşlyk boldy ❌";
    console.log(e);
  }
}
</script>

</body>
</html>
