<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UserrTM Speed Test</title>

<style>
body{
  font-family: Arial;
  background:#f4f6fb;
  text-align:center;
  padding:20px;
}

h1{
  font-size:28px;
}

#startBtn{
  width:180px;
  height:180px;
  border-radius:50%;
  border:6px solid #5b6cff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:30px auto;
  font-size:26px;
  color:#5b6cff;
  cursor:pointer;
}

.card{
  background:white;
  margin:10px auto;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:400px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.big{
  font-size:30px;
  font-weight:bold;
}

.footer{
  margin-top:20px;
  color:#666;
}

.flag{
  font-size:30px;
}
</style>
</head>

<body>

<h1>UserrTM Speed Test</h1>

<div id="startBtn">Start</div>

<div class="card">
  <div>Download</div>
  <div class="big" id="download">0.00</div>
  Mbps
</div>

<div class="card">
  <div>Ping</div>
  <div class="big" id="ping">0</div>
  ms
</div>

<div class="card">
  <div>Jitter</div>
  <div class="big" id="jitter">0</div>
  ms
</div>

<div class="card">
  <div>IP Info</div>
  <br>
  <div id="ip">-</div>
  <div id="country">-</div>
  <div class="flag" id="flag"></div>
</div>

<div class="footer">
© 2026 UserrTM Servers<br>
<b>userrtm.com</b>
</div>

<script>
const API = "https://api.userrtmspeedtest.vip";

function sleep(ms){
  return new Promise(r => setTimeout(r, ms));
}

function flagEmoji(code){
  if(!code) return "";
  return code
    .toUpperCase()
    .replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt()));
}

async function getIP(){
  try{
    let res = await fetch(API + "/ipinfo");
    let data = await res.json();

    document.getElementById("ip").innerText = data.ip;
    document.getElementById("country").innerText = data.country;
    document.getElementById("flag").innerText = flagEmoji(data.country_code);
  }catch(e){}
}

async function testPing(){
  let times = [];

  for(let i=0;i<10;i++){
    let t1 = performance.now();
    await fetch(API + "/ping");
    let t2 = performance.now();

    times.push(t2 - t1);
    await sleep(180);
  }

  let avg = times.reduce((a,b)=>a+b,0)/times.length;
  let jitter = Math.max(...times) - Math.min(...times);

  document.getElementById("ping").innerText = avg.toFixed(0);
  document.getElementById("jitter").innerText = jitter.toFixed(0);
}

async function testDownload(){
  let start = performance.now();
  let bytes = 0;

  const controller = new AbortController();

  fetch(API + "/download", {signal: controller.signal}).then(res=>{
    const reader = res.body.getReader();

    function read(){
      reader.read().then(({done,value})=>{
        if(done) return;

        bytes += value.length;

        let now = performance.now();
        let speed = (bytes * 8) / ((now - start)/1000) / 1024 / 1024;

        document.getElementById("download").innerText = speed.toFixed(2);

        read();
      });
    }

    read();
  });

  await sleep(15000); // 🔥 15 SEKUNT
  controller.abort();
}

document.getElementById("startBtn").onclick = async ()=>{
  document.getElementById("download").innerText = "0.00";
  document.getElementById("ping").innerText = "0";
  document.getElementById("jitter").innerText = "0";

  await getIP();
  await testPing();
  await testDownload();
};
</script>

</body>
</html>
