<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UserrTM Speed</title>
<style>
body{font-family:sans-serif;text-align:center}
button{padding:20px;font-size:20px}
.box{margin:20px;font-size:25px}
</style>
</head>
<body>

<h2>UserrTM Speed Test</h2>

<button onclick="run()">START</button>

<div class="box">Download: <span id="d">0</span> Mbps</div>
<div class="box">Ping: <span id="p">0</span> ms</div>

<script>
const API = "https://api.userrtmspeedtest.vip";

async function run(){

// ping
let t1 = Date.now();
await fetch(API+"/ping");
let t2 = Date.now();
document.getElementById("p").innerText = (t2-t1);

// download
let start = Date.now();
let bytes = 0;

const res = await fetch(API+"/download");
const reader = res.body.getReader();

while(true){
  const {done,value} = await reader.read();
  if(done) break;

  bytes += value.length;

  let time = (Date.now()-start)/1000;
  let speed = (bytes*8/1024/1024)/time;

  document.getElementById("d").innerText = speed.toFixed(2);

  if(time > 5) break;
}

}
</script>

</body>
</html>
