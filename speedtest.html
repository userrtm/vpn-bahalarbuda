<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UserrTM Speed Test</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f7fb;
}

button {
  margin-top: 50px;
  padding: 20px 40px;
  font-size: 22px;
  border-radius: 50%;
  border: 3px solid #5a67d8;
  background: white;
  color: #5a67d8;
}

.card {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 15px;
  font-size: 24px;
}
</style>
</head>

<body>

<h2>UserrTM Speed Test</h2>

<button onclick="startTest()">Start</button>

<div class="card">Download: <span id="down">0</span> Mbps</div>
<div class="card">Ping: <span id="ping">0</span> ms</div>

<script>

const API = "https://api.userrtmspeedtest.vip";

async function startTest() {

  // ping
  let t1 = Date.now();
  await fetch(API + "/ping");
  let t2 = Date.now();
  document.getElementById("ping").innerText = (t2 - t1);

  // download test
  let start = Date.now();
  let bytes = 0;

  const res = await fetch(API + "/download");
  const reader = res.body.getReader();

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    bytes += value.length;

    let time = (Date.now() - start) / 1000;
    let speed = (bytes * 8 / 1024 / 1024) / time;

    document.getElementById("down").innerText = speed.toFixed(2);

    if (time > 5) break; // 5 sekund test
  }
}

</script>

</body>
</html>
